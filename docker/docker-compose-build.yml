# LOCAL BUILD of the production image, for smoke-testing it before you tag a
# release. Not a deployment: no reverse proxy, port published on the host.
# Run from the repo root (reads ./.env):  make image / make up / make down
# The deployable example (registry image, Traefik) is deploy/docker-compose.yml.
name: converge-local

services:
  converge:
    container_name: converge-local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: converge:local
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://converge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@converge-local-db:5432/converge
      CONVERGE_BIND: 0.0.0.0:8080
      CONVERGE_SECRET_KEY: ${CONVERGE_SECRET_KEY:?set CONVERGE_SECRET_KEY in .env (make secret)}
      CONVERGE_PUBLIC_URL: ${CONVERGE_PUBLIC_URL:-}
      CONVERGE_COOKIE_SECURE: ${CONVERGE_COOKIE_SECURE:-false}
      CONVERGE_BEHIND_PROXY: "false"
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      converge-local-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  converge-local-db:
    container_name: converge-local-db
    image: docker.io/library/postgres:17-alpine
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: converge
      POSTGRES_USER: converge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${CONVERGE_DB_DIR:-../data/postgres}:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
